version: '3.8'

services:
  android9-kasmvnc:
    build: .
    container_name: android9-emulator
    ports:
      - "5554:5554"  # ADB port
      - "5555:5555"  # ADB port
      - "6080:6080"  # noVNC web interface
    environment:
      - DISPLAY=:1
      - DEVICE=Samsung Galaxy S10
    volumes:
      - android_data:/home/androidusr/.android
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm  # For hardware acceleration (if available)
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/home/androidusr/docker-android/mixins/scripts/run.sh &
      sleep 15 &&
      /home/androidusr/docker-android/mixins/scripts/start-novnc.sh"

volumes:
  android_data:
